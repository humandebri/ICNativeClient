name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Unit tests
        run: swift test
      - name: Swift 6 strict concurrency
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: iOS Simulator build
        run: xcodebuild -scheme ICNativeClient -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
