name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bindgen:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Rust formatting
        run: cargo fmt --manifest-path Tools/ic-candid-swift-bindgen/Cargo.toml -- --check
      - name: Rust lint
        run: cargo clippy --locked --manifest-path Tools/ic-candid-swift-bindgen/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path Tools/ic-candid-swift-bindgen/Cargo.toml
      - name: Verify embedded artifact bundle
        run: Tools/ic-candid-swift-bindgen/scripts/verify-artifact-bundle.sh
      - name: Test stale artifact detection
        run: Tools/ic-candid-swift-bindgen/scripts/test-artifact-verification.sh
      - name: Build tool plugin fixture
        run: swift test --package-path Tests/BindgenPluginFixture -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Build tool plugin fixture from renamed checkout
        run: |
          temporary="$(mktemp -d "${RUNNER_TEMP}/ic-bindgen-renamed.XXXXXX")"
          trap 'rm -rf "$temporary"' EXIT
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$temporary/renamed-checkout"
          swift test \
            --package-path "$temporary/renamed-checkout/Tests/BindgenPluginFixture" \
            -Xswiftc -swift-version \
            -Xswiftc 6 \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
      - name: Build Xcode project plugin fixture
        run: |
          xcodebuild build \
            -project Tests/BindgenXcodePluginFixture/BindgenXcodePluginFixture.xcodeproj \
            -scheme FixtureApp \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests
        run: swift test
      - name: Swift 6 strict concurrency
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Run iOS Simulator tests
        run: |
          simulator_id="$(
            xcrun simctl list devices available -j |
              python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")))'
          )"
          xcodebuild test \
            -scheme ICNativeClient \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            CODE_SIGNING_ALLOWED=NO
