[package]
name = "ic-candid-swift-bindgen"
version = "0.1.2"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Generate ICNativeClient Swift bindings from Candid interfaces"

[dependencies]
anyhow = "1.0"
candid_parser = "=0.4.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"
